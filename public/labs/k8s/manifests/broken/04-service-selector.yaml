apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-svc
  namespace: k8s-lab
  labels:
    app: web-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-svc
  template:
    metadata:
      labels:
        app: web-svc
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-broken
  namespace: k8s-lab
spec:
  selector:
    app: web-wrong
  ports:
    - name: http
      port: 80
      targetPort: 80
