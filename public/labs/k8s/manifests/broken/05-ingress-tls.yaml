apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-broken
  namespace: k8s-lab
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - broken.local
      secretName: broken-tls
  rules:
    - host: broken.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-missing
                port:
                  number: 80
