apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bad-image
  namespace: k8s-lab
  labels:
    app: web-bad-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-bad-image
  template:
    metadata:
      labels:
        app: web-bad-image
    spec:
      containers:
        - name: app
          image: nginx:1.99.0-no-existe
