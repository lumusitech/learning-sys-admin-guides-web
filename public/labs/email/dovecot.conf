protocols = imap
listen = *
mail_location = maildir:~/Maildir
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_username_format = %Ln

passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

userdb {
  driver = passwd
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

ssl = no
log_path = /var/log/dovecot.log
